[project]
name = "chess-guard"
version = "0.1.0"
description = "Система выявления подсказок шахматного движка"
requires-python = ">=3.12"
dependencies = [
    "python-chess>=1.999",
    "pandas>=2.2.0",
    "lightgbm>=4.0.0",
    "scikit-learn>=1.5.0",
    "berserk>=0.13.2",
    "streamlit>=1.40.0",
    "plotly>=5.24.0",
    "tqdm>=4.66.0",
    "pyarrow>=25.0.1",
    "joblib>=1.6.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chess_guard"]
